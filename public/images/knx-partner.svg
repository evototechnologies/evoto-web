  <!-- Arch — blue right segment -->
  <path d="M 230 18 A 212 212 0 0 1 438 228"
        fill="none" stroke="#1B3F8B" stroke-width="32" stroke-linecap="butt"/>

  <!-- K in green -->
  <text x="8" y="294"
